book you finish and want to pass on."}],yf=[{name:"SHADAVELI COMPANY",country:"Nigeria",bio:"A company building simple, useful products for everyday people on Pi Network — starting with books. Publishing practical stories and guides that help founders, readers and small businesses grow.",followers:1240,color:"#7C3AED",initials:"SC",focus:"Business • Self-Help"},{name:"Adaeze Okafor",country:"Nigeria",bio:"Writer and coach helping new authors turn scattered notes into finished books. Her work is calm, practical and full of small steps that actually fit real life.",followers:842,color:"#3B82F6",initials:"AO",focus:"Self-Help • Writing"},{name:"Efe Oghene",country:"Nigeria",bio:"Storyteller from Warri. Efe writes warm, funny, connected stories about family, street wisdom, music and growing up — stories that feel like home.",followers:918,color:"#0891B2",initials:"EO",focus:"Fiction • Stories"},{name:"Miriam Ade",country:"Ghana",bio:"Author of short reflections on courage, patience and hope. Miriam writes for the quiet nights — steady words for readers who need one calm step at a time.",followers:764,color:"#7C5CFF",initials:"MA",focus:"Faith • Reflection"}],yg=[{day:"Mon",value:8.4},{day:"Tue",value:12.2},{day:"Wed",value:6.8},{day:"Thu",value:15.6},{day:"Fri",value:11.4},{day:"Sat",value:19.8},{day:"Sun",value:14.1}],vf=[{id:"lagos",title:"The Lagos Hustle",author:"G. Ejoke",price:2.5,category:"Fiction",rating:4.7,pages:214,color:"#E94E6A",ink:"#fff",description:"A sharp, funny and deeply human story about ambition, family and the small bargains people make while chasing a bigger life in Lagos.",excerpt:["The bus stopped where the road forgot its manners. Amara held her bag close, not because she feared the city, but because she knew it too well.","By nightfall, the plan had changed three times. That was not failure. In Lagos, it was called research."],chapters:[["The bus stopped where the road forgot its manners. Amara held her bag close, not because she feared the city, but because she knew it too well. The market smelled of rain, roasted corn, and possibility.","By nightfall, the plan had changed three times. That was not failure. In Lagos, it was called research. She learned which doors opened with a smile, which opened with patience, and which were only doors because someone had painted them on a wall.","At the last stall, Mama N. offered her a chair and a truth: nobody wins the city in one day. You win it by returning. Amara returned the next morning, earlier, clearer, and unwilling to be small.","The hustle was never only about money. It was about proof—proof that a beginning could be made from almost nothing, and that a name could still travel farther than a bus."],["A new customer arrived with a complicated request and a short deadline. Amara listened longer than anyone expected, then said the two words that changed everything: I can.","She built the work in pieces, asked better questions, and kept a small notebook where every promise had a date beside it. Trust, she learned, was a kind of currency that did not lose value.","When the first payment arrived, she did not celebrate loudly. She bought better tools, paid the person who helped her, and wrote down what she would do differently next time. The city noticed.","By the end of the week, her name had moved from one conversation to another. Not because she shouted. Because she delivered."]]},{id:"pibegin",title:"Pi For Beginners",author:"Pi Pioneer",price:0,category:"Tech",rating:4.8,pages:132,color:"#F2B705",ink:"#1A0B2E",description:"A friendly, jargon-light introduction to Pi Network, wallets, test transactions, and how digital value moves in a community-first ecosystem.",excerpt:["Pi begins with a simple idea: digital money should be usable by ordinary people, not only by experts.","This guide walks slowly. No rush. No mystery. Just the concepts, the buttons, and the habits that make the experience make sense."],chapters:[["Pi begins with a simple idea: digital money should be usable by ordinary people, not only by experts. A wallet is a place to keep value. A transaction is a record of moving it. A network is the community that agrees the record matters.","In Test-Pi Mode, you can practice without risk. Press the buttons. Read the messages. Notice how each step asks for a clear approval before anything moves. Good design should feel calm, not hurried.","Your balance is not a score. It is a tool. Use a little. Learn a little. Ask questions. The people who understand new money best are often the people who take time to practice.","Before you send anything, check three things: who receives it, how much it is, and why you are sending it. If all three are clear, you are ready for the next chapter."],["A payment has a beginning, a middle, and an end. It starts when you choose. It moves when you approve. It finishes when the record is confirmed and both sides can see the result.","Keep your recovery details private. Keep your device updated. If something feels rushed or confusing, pause. A real payment can wait for a calm decision.","The best way to learn is to explain it to someone else. If you can describe Pi in two sentences, you understand it better than most people on the internet.","You do not need to know everything today. Learn one idea. Try one safe action. Come back tomorrow a little wiser."]]},{id:"zero",title:"From Zero to Author",author:"Adaeze Okafor",price:1.2,category:"Self-Help",rating:4.6,pages:178,color:"#3B82F6",ink:"#fff",description:"A practical, encouraging workbook for turning scattered notes into a finished book—one small, repeatable writing session at a time.",excerpt:["Every book begins as a sentence that refuses to leave. This one begins with yours.","You do not need a perfect routine. You need a page, twenty honest minutes, and permission to write badly before you write well."],chapters:[["Every book begins as a sentence that refuses to leave. This one begins with yours. Write it down before it becomes a story you tell at dinner and never finish.","You do not need a perfect routine. You need a page, twenty honest minutes, and permission to write badly before you write well. Bad first drafts are not failures. They are raw material.","Choose a small daily target. One paragraph is enough. A paragraph a day becomes a chapter in a month, and a chapter a month becomes a book sooner than you expect.","Keep a list of ideas beside your draft. When one chapter ends, the next one is already waiting. Momentum is not magic. It is a list."],["Editing is translation. You are turning the book you meant to write into the book a reader can actually follow. Read it aloud. Mark the places where you stumble. Those are the places to fix.","Ask one trusted reader a useful question: Where did you get bored? Where did you get lost? Where did you want more? Their answers are a map.","A finished book is a series of small promises kept. Keep the next one. Write the next paragraph. Send the next draft. You are closer than the blank page suggests.","When the book is ready, publish it with pride. Someone needs the exact lesson only your life could teach."]]},{id:"faith",title:"Faith in the Storm",author:"Miriam Ade",price:0,category:"Faith",rating:4.9,pages:156,color:"#7C5CFF",ink:"#fff",description:"Short reflections on courage, patience, and hope—written for the nights when the future feels uncertain and the next step feels too small.",excerpt:["The storm did not ask permission. It arrived in the middle of ordinary plans and changed the shape of the week.","Faith, in this book, is not pretending the wind is gone. It is learning how to stand, breathe, and take one steady step at a time."],chapters:[["The storm did not ask permission. It arrived in the middle of ordinary plans and changed the shape of the week. The lights flickered. The road disappeared. The news kept moving.","Faith, in this book, is not pretending the wind is gone. It is learning how to stand, breathe, and take one steady step at a time. Courage is rarely loud. Sometimes it is simply staying.","On the hardest night, Miriam made tea, wrote down three things she still had, and read them until her breathing slowed. The storm was still there. So was she.","Hope is not a promise that nothing will break. It is the belief that what remains can still be rebuilt, one careful day at a time."],["The morning after a storm is quiet in a particular way. The world looks both familiar and changed. You begin by clearing one path, then another.","Help arrives in ordinary forms: a neighbor, a phone call, a shared meal, a person who says, I have been here too. Receive it with grace.","You do not need to rebuild everything today. Choose the room, the relationship, or the routine that matters most. Start there.","Later, you will tell this story differently. Not as the storm that broke you, but as the season that taught you how strong steady can be."]]},{id:"business",title:"Small Business, Big Pi",author:"Chidi Nwosu",price:3,category:"Business",rating:4.7,pages:203,color:"#10B981",ink:"#fff",description:"A field guide to pricing, customers, and cash flow for small businesses—plus practical ways to accept Pi without losing the human side of selling.",excerpt:["A small business is not a smaller version of a big one. It is a closer one.","This book shows how to price with confidence, serve one customer well, and build a business that can survive a slow month."],chapters:[["A small business is not a smaller version of a big one. It is a closer one. You know your customers by name. You remember what they bought last time. That closeness is your advantage.","Price is a story. If the story is only cheap, customers leave when someone cheaper arrives. If the story is clear, careful, and dependable, they return because they trust you.","Write down every cost, including your time. A business that cannot pay its owner is not a business. It is an expensive hobby with good intentions.","Choose one customer and serve them so well that they tell someone else. Word of mouth is slow, honest, and more durable than any advertisement."],["Cash flow is the weather of a small business. A sunny month can hide a coming storm. Save a little when sales are strong, and you will not panic when they slow.","If you accept Pi, make the process simple. Show the price clearly. Confirm the amount. Give a receipt. The customer should never have to guess what happened.","Keep a weekly review: what sold, what did not, what took too long, and what one small change would make next week easier. Small changes compound.","Big does not mean loud. A big Pi business is one that keeps its promises, pays its people, and still has room to be kind."]]},{id:"trader",title:"The Night Trader",author:"K. Balogun",price:1.8,category:"Fiction",rating:4.5,pages:241,color:"#122E55",ink:"#F2B705",description:"A taut Lagos noir about a trader who notices one impossible pattern in the market—and the people who would rather it stayed hidden.",excerpt:["At 2:14 a.m., the numbers stopped behaving. Tunde stared at the screen until the screen seemed to stare back.","Every market has a rhythm. This one had a heartbeat. And someone was trying to hold it still."],chapters:[["At 2:14 a.m., the numbers stopped behaving. Tunde stared at the screen until the screen seemed to stare back. He refreshed the page. The pattern did not move.","Every market has a rhythm. This one had a heartbeat. And someone was trying to hold it still. He wrote down the times, the amounts, and the names that appeared too neatly.","The city outside was quiet. Inside, a decision was forming: look away and sleep, or follow the thread until it led somewhere dangerous. He chose the thread.","By dawn, he had a notebook full of questions and a phone full of missed calls. The market would open again. The pattern would return. So would he."],["A stranger offered him an easy answer. Easy answers, Tunde knew, were the most expensive kind. He asked for proof, and the room became very quiet.","He followed the money through small shops, quiet offices, and one restaurant where nobody looked up when he entered. Every clue pointed to a door he had walked past for years.","Behind the door was not a villain. It was a system: tired people, old debts, and choices that had seemed small at the time. The truth was more ordinary—and more dangerous—than he expected.","Tunde did not save the city. He told one true story, clearly, and let other people decide what to do with it. Sometimes that is enough."]]},{id:"python",title:"Learn Python in 7 Days",author:"Tobi Alabi",price:2,category:"Tech",rating:4.6,pages:189,color:"#F97316",ink:"#fff",description:"A calm, project-based crash course. Each day ends with something you can run, fix, and show someone else.",excerpt:["Day One does not begin with theory. It begins with one line of code that works.","By Day Seven, you will not know everything. You will know something better: how to start, how to test, and how to keep going."],chapters:[["Day One does not begin with theory. It begins with one line of code that works. Type it. Run it. Change one word. Run it again. That small loop is programming.","A variable is a labeled box. A function is a recipe. A loop is a way of saying, do this again, but a little differently each time. You do not need to memorize everything. You need to practice the pattern.","Errors are not insults. They are messages. Read the last line first. It usually tells you exactly where the program got confused.","By the end of Day One, you will have a program with your name in it. Save it. Tomorrow, you will make it better."],["Day Four is about decisions. If this happens, do that. Otherwise, do something else. Programs are not clever because they know everything. They are useful because they follow clear rules.","Break a big problem into small pieces. Solve one piece. Test it. Then solve the next. A program built this way is easier to fix and easier to explain.","Ask the computer a question and print the answer. If the answer is wrong, you have learned something. If it is right, you have built something.","On Day Seven, finish a small project: a quiz, a calculator, or a list that helps a real person. Done is better than perfect. Your next project starts tomorrow."]]},{id:"warri",title:"Warri Stories",author:"Efe Oghene",price:0.8,category:"Fiction",rating:4.8,pages:148,color:"#0891B2",ink:"#fff",description:"A warm, sharp collection of connected stories about family, street wisdom, music, and the everyday comedy of growing up in Warri.",excerpt:["Nobody in Warri tells a story straight. They tell it with a detour, a song, and a moral that arrives five minutes after the laughter.","These stories begin at a bus stop, in a kitchen, and on a street where everybody knows your grandmother's name."],chapters:[["Nobody in Warri tells a story straight. They tell it with a detour, a song, and a moral that arrives five minutes after the laughter. Efe learned that listening was a kind of education.","These stories begin at a bus stop, in a kitchen, and on a street where everybody knows your grandmother's name. Privacy was a rumor. Community was a fact.","In the first story, a boy tries to impress his uncle by fixing a radio. The radio stays broken. The boy learns how to tell the truth with a smile, which is a more useful repair.","Every story ends the same way: someone says, you think you know, and everyone at the table laughs, because they know the next story is already waiting."],["The second story belongs to a market woman who could sell rain in the rainy season. Her secret was not the price. It was remembering every customer, every birthday, and every small promise.","A young musician plays one song too many times. The street teaches him that talent needs timing, and timing needs listening. He learns to pause.","At a family gathering, two cousins argue about football until their grandmother settles it with one sentence and a plate of food. Peace, in Warri, often arrives with dinner.","The final story is quiet. An old man walks home slowly, greeting every shopkeeper by name. The street greets him back. That is the whole story. That is enough."]]}],vg=[{id:"my1",title:"The Quiet Founder",author:"SHADAVELI COMPANY",publisher:"SHADAVELI COMPANY",price:1.5,category:"Business",rating:4.8,pages:164,color:"#8B5CF6",ink:"#fff",description:"Lessons from building slowly, listening closely, and keeping a small business honest through its first hard year.",excerpt:["The first customer was not a crowd. It was one person who believed the work was worth paying for.","This book is for founders who would rather be trusted than famous."],chapters:[["The first customer was not a crowd. It was one person who believed the work was worth paying for. Treat that person like the whole business depends on them, because at the beginning, it does.","Write down what you promised. Do it. Write down what you learned. Repeat. A quiet business can grow without shouting if it keeps its promises.","When money is tight, choose clarity over speed. A clear price, a clear offer, and a clear next step will carry you through more than a clever campaign.","Success arrived slowly, then all at once: a referral, a repeat order, a message that said, I told my sister about you. That is how quiet founders grow."],["The founder kept a small notebook of mistakes. Not to feel bad, but to avoid paying for the same lesson twice. Every business needs one.","Hiring the first helper was not about finding the cheapest hands. It was about finding someone who cared how the customer felt after the sale.","Systems are kindness to your future self. A checklist, a template, a simple record of sales. They make room for rest.","The book ends where it began: with one customer, one promise, and one quiet decision to do good work again tomorrow."]],mine:!0,status:"Live",sales:42,readers:318},{id:"my2",title:"Notes on Starting Small",author:"SHADAVELI COMPANY",publisher:"SHADAVELI COMPANY",price:0,category:"Self-Help",rating:4.7,pages:96,color:"#C2410C",ink:"#fff",description:"A short, practical notebook for turning one small idea into one finished first step.",excerpt:["You do not need a perfect plan. You need a first page.","Start smaller than you want to. Finish faster than you fear."],chapters:[["You do not need a perfect plan. You need a first page. Write the idea in one sentence. If you cannot, the idea is not ready. If you can, the work has begun.","Start smaller than you want to. Finish faster than you fear. A small finished thing teaches more than a large imagined thing.","Choose one action for today. Not five. One. Do it before the day gets loud.","At night, write down what worked. Keep it. Tomorrow, do that again."],["Fear often sounds reasonable. It says, wait until you are ready. Answer it with evidence: one small step, completed, on purpose.","Ask for help early. Most people like helping a person who has already started.","Your first version does not need to impress everyone. It needs to help someone, even if that someone is only you.","Starting small is not thinking small. It is building a foundation that can hold something bigger later."]],mine:!0,status:"Draft",sales:0,readers:64}],wg=["All","Fiction","Business","Self-Help","Tech","Faith","Free"],il=[{name:"Royal Plum",color:"#7C3AED",ink:"#fff"},{name:"Pi Gold",color:"#F2B705",ink:"#1A0B2E"},{name:"Ocean",color:"#0E7490",ink:"#fff"},{name:"Sunset",color:"#EA580C",ink:"#fff"},{name:"Forest",color:"#15803D",ink:"#fff"},{name:"Rose",color:"#BE123C",ink:"#fff"}],wf=["Creating payment...","Approving on server...","Confirm in Pi Wallet..."];function al({value:e}){return c("div",{className:"flex items-center gap-0.5","aria-label":`${e} out of 5 stars`,children:[[1,2,3,4,5].map((t)=>a(nl,{size:13,className:t<=Math.round(e)?"fill-[#F2B705] text-[#F2B705]":"text-white/30"},t)),a("span",{className:"ml-1 text-xs text-white/70",children:e.toFixed(1)})]})}function Hn({book:e,large:t=!1}){retu
